# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  # Sync enquiry course dropdowns on contact.html + index.html from _build_catalog CARDS/P1, then GTM inject.
  command = "python3 scripts/build_contact_course_select.py && python3 scripts/publish_admin_overrides.py && python3 scripts/inject_gtm.py"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Stripe webhook needs the raw request body for signature verification.
[functions.stripe-webhook]
  included_files = []

[[redirects]]
  from = "/enrollment/completed"
  to = "/enrollment/completed.html"
  status = 200

[[redirects]]
  from = "/enrollment/cancelled"
  to = "/enrollment/cancelled.html"
  status = 200

[[redirects]]
  from = "/enrollment/success"
  to = "/enrollment/success.html"
  status = 200

[[redirects]]
  from = "/enrollment/cancel"
  to = "/enrollment/cancel.html"
  status = 200

[[redirects]]
  from = "/api/stripe-checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/fx-rates"
  to = "/.netlify/functions/fx-rates"
  status = 200
