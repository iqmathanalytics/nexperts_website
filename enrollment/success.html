<title>Enrollment Confirmed | Nexperts Academy</title>
<link rel="icon" sizes="192x192" href="/favicon.png" type="image/png">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d1117;
    --ink3: #7a8194;
    --mar: #0a4d68;
    --bg: #f4f6f8;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background: linear-gradient(165deg, #e8f2f6 0%, var(--bg) 45%, #fff 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.85);
  }
  header a {
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
    font-size: 1.05rem;
  }
  header a span { color: var(--mar); }
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 48px 20px;
  }
  .card {
    max-width: 520px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(15,23,42,.08);
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #ecfdf5;
    color: #15803d;
    display: grid;
    place-items: center;
    font-size: 1.8rem;
    margin: 0 auto 20px;
  }
  h1 {
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: 1.85rem;
    margin-bottom: 12px;
  }
  p {
    font-size: 0.95rem;
    color: var(--ink3);
    line-height: 1.65;
    margin-bottom: 14px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.88rem;
    text-decoration: none;
  }
  .btn-primary { background: var(--mar); color: #fff; }
  .btn-ghost { background: #fff; color: var(--mar); border: 1.5px solid #c5d5de; }
</style>
</head>
<body>
<!-- nexperts-gtm-noscript:v1 -->
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5PRVNR2"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<!-- /nexperts-gtm-noscript:v1 -->

<header>
  <a href="/">Nexperts <span>Academy</span></a>
</header>
<main>
  <div class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Payment successful</h1>
    <p>Thank you for enrolling. Your seat is confirmed.</p>
    <p id="fulfillMsg">Please check your email for the confirmation message and PDF payment receipt. If it does not arrive within a few minutes, check spam or promotions.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/contact">Contact us</a>
    </div>
  </div>
</main>
<script>
(function () {
  try {
    var params = new URLSearchParams(location.search || "");
    var sessionId = String(params.get("session_id") || "").trim();
    var msg = document.getElementById("fulfillMsg");
    if (!sessionId) return;
    var guardKey = "nx_fulfill_" + sessionId;
    try {
      if (sessionStorage.getItem(guardKey) === "1") return;
      sessionStorage.setItem(guardKey, "1");
    } catch (_) { /* ignore */ }
    fetch("/api/stripe-fulfill", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ session_id: sessionId }),
    })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (data) {
        if (!msg || !data) return;
        if (data.ok) {
          msg.textContent = "Confirmation email with your PDF receipt has been sent (or was already sent). Please also check spam or promotions.";
        } else if (data && data.error === "not_paid") {
          msg.textContent = "Payment is still processing. If you were charged, contact us with your receipt.";
        }
      })
      .catch(function () { /* webhook may still deliver */ });
  } catch (_) { /* ignore */ }
})();
</script>
</body>
</html>
