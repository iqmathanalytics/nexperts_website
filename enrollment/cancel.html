<title>Payment Cancelled | Nexperts Academy</title>
<link rel="icon" sizes="192x192" href="/favicon.png" type="image/png">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d1117;
    --ink3: #7a8194;
    --mar: #0a4d68;
    --bg: #f4f6f8;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background: linear-gradient(165deg, #f6f0e8 0%, var(--bg) 45%, #fff 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.85);
  }
  header a {
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
    font-size: 1.05rem;
  }
  header a span { color: var(--mar); }
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 48px 20px;
  }
  .card {
    max-width: 520px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(15,23,42,.08);
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #fff7ed;
    color: #c2410c;
    display: grid;
    place-items: center;
    font-size: 1.6rem;
    margin: 0 auto 20px;
  }
  h1 {
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: 1.85rem;
    margin-bottom: 12px;
  }
  p {
    font-size: 0.95rem;
    color: var(--ink3);
    line-height: 1.65;
    margin-bottom: 14px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.88rem;
    text-decoration: none;
  }
  .btn-primary { background: var(--mar); color: #fff; }
  .btn-ghost { background: #fff; color: var(--mar); border: 1.5px solid #c5d5de; }
</style>
</head>
<body>
<!-- nexperts-gtm-noscript:v1 -->
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5PRVNR2"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<!-- /nexperts-gtm-noscript:v1 -->

<header>
  <a href="/">Nexperts <span>Academy</span></a>
</header>
<main>
  <div class="card">
    <div class="icon" aria-hidden="true">!</div>
    <h1>Payment cancelled</h1>
    <p>No charge was made. You can return to the course page and try again whenever you are ready.</p>
    <div class="actions">
      <a class="btn btn-primary" id="backCourse" href="/">Back to courses</a>
      <a class="btn btn-ghost" href="/contact">Enquire instead</a>
    </div>
  </div>
</main>
<script>
(function () {
  try {
    var params = new URLSearchParams(location.search || "");
    var course = String(params.get("course") || "").trim();
    var map = {
      "agentic-ai": "/courses/agentic-ai#enroll",
      "claude-ai-productivity-90-minutes": "/courses/claude-ai-productivity-90-minutes#enroll"
    };
    if (map[course]) {
      var a = document.getElementById("backCourse");
      if (a) {
        a.href = map[course];
        a.textContent = "Back to course";
      }
    }
  } catch (_) { /* ignore */ }
})();
</script>
</body>
</html>
